quarkus.http.port=8080
quarkus.http.limits.max-body-size=1M

# --- H2 en memoria (sin instalaciones ni contenedores) -------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:idempotency;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=5000
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=8

# --- Hibernate ----------------------------------------------------------------
# El esquema lo crea SchemaInitializer con db/schema.sql (no lo genera Hibernate)
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

# --- Idempotencia -------------------------------------------------------------
# Cuanto tiempo se recuerda una key COMPLETED (ventana de replay)
wrda.idempotency.ttl=PT24H
# El secreto HMAC se inyecta desde el secret manager del entorno; nunca guardarlo en Git.
wrda.idempotency.hmac-key=${WRDA_IDEMPOTENCY_HMAC_KEY}
# En producción bancaria habilitar autenticación y mapear tenant_id en SecurityIdentity.
wrda.idempotency.require-authenticated-identity=${WRDA_IDEMPOTENCY_REQUIRE_AUTHENTICATED_IDENTITY:false}
wrda.idempotency.tenant-identity-attribute=tenant_id
wrda.idempotency.max-response-bytes=1048576
# Cada cuanto se borran las keys vencidas
wrda.idempotency.cleanup-every=5m

# Perfil SQL Server: iniciar con -Dquarkus.profile=sqlserver.
# H2 permanece como base por defecto para desarrollo local y pruebas.
%sqlserver.quarkus.datasource.db-kind=mssql
%sqlserver.quarkus.datasource.username=${SQLSERVER_USERNAME}
%sqlserver.quarkus.datasource.password=${SQLSERVER_PASSWORD}
%sqlserver.quarkus.datasource.jdbc.url=${SQLSERVER_JDBC_URL:jdbc:sqlserver://localhost:1433;databaseName=idempotency;encrypt=true;trustServerCertificate=true}
%sqlserver.quarkus.datasource.jdbc.max-size=16
%sqlserver.wrda.idempotency.schema-resource=/db/schema-sqlserver.sql
