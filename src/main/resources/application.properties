quarkus.http.port=8080

# --- H2 en memoria (sin instalaciones ni contenedores) -------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:idempotency;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=5000
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=8

# --- Hibernate ----------------------------------------------------------------
# El esquema lo crea SchemaInitializer con db/schema.sql (no lo genera Hibernate)
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

# --- Idempotencia -------------------------------------------------------------
# Cuanto tiempo se recuerda una key COMPLETED (ventana de replay)
wrda.idempotency.ttl=PT24H
# Un IN_PROGRESS mas viejo que esto se considera huerfano (el proceso murio) y se puede retomar.
# Debe ser MAYOR que la duracion maxima de tu operacion de negocio.
wrda.idempotency.in-progress-timeout=PT30S
# Cada cuanto se borran las keys vencidas
wrda.idempotency.cleanup-every=5m
